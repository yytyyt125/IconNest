<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',-apple-system,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#13213b"/>
      <stop offset="1" stop-color="#0a1a2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2c47"/>
      <stop offset="1" stop-color="#16223a"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- subtle grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="320" y1="0" x2="320" y2="640"/>
    <line x1="640" y1="0" x2="640" y2="640"/>
    <line x1="960" y1="0" x2="960" y2="640"/>
  </g>

  <!-- ===== Left: brand ===== -->
  <!-- logo mark: rounded square with a nest/grid motif -->
  <g transform="translate(96,150)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="url(#accent)"/>
    <g fill="#0b1220">
      <rect x="22" y="22" width="20" height="20" rx="5"/>
      <rect x="54" y="22" width="20" height="20" rx="5"/>
      <rect x="22" y="54" width="20" height="20" rx="5"/>
      <rect x="54" y="54" width="20" height="20" rx="5"/>
    </g>
  </g>

  <text x="220" y="210" fill="#f8fafc" font-size="74" font-weight="700" letter-spacing="1">IconNest</text>
  <text x="222" y="262" fill="#cbd5e1" font-size="30" font-weight="400">绿色免安装 · Windows 桌面图标整理工具</text>
  <text x="222" y="312" fill="#7dd3fc" font-size="26" font-weight="400">拖入即分类，单文件分发，开箱即用</text>

  <!-- version pill -->
  <g transform="translate(222,348)">
    <rect x="0" y="0" width="148" height="46" rx="23" fill="#2dd4bf" fill-opacity="0.14" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="74" y="31" fill="#5eead4" font-size="24" font-weight="600" text-anchor="middle">v0.2.12</text>
  </g>
  <g transform="translate(386,348)">
    <rect x="0" y="0" width="120" height="46" rx="23" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="60" y="31" fill="#7dd3fc" font-size="22" font-weight="600" text-anchor="middle">开源</text>
  </g>

  <!-- ===== Right: organized desktop icon cluster ===== -->
  <g transform="translate(840,120)">
    <!-- a faint "desktop" panel -->
    <rect x="0" y="0" width="360" height="400" rx="20" fill="#0f1c33" fill-opacity="0.55" stroke="#ffffff" stroke-opacity="0.06"/>

    <!-- 3x3 organized grid of icon tiles -->
    <g>
      <!-- row 1 -->
      <g transform="translate(40,40)">
        <rect width="88" height="88" rx="16" fill="url(#tile)" stroke="#38bdf8" stroke-opacity="0.35"/>
        <rect x="28" y="24" width="32" height="26" rx="4" fill="#38bdf8" fill-opacity="0.85"/>
        <rect x="24" y="52" width="40" height="6" rx="3" fill="#64748b"/>
        <rect x="24" y="64" width="28" height="6" rx="3" fill="#475569"/>
      </g>
      <g transform="translate(136,40)">
        <rect width="88" height="88" rx="16" fill="url(#tile)" stroke="#2dd4bf" stroke-opacity="0.35"/>
        <circle cx="44" cy="40" r="18" fill="none" stroke="#2dd4bf" stroke-width="5" stroke-opacity="0.85"/>
        <rect x="24" y="66" width="40" height="6" rx="3" fill="#475569"/>
      </g>
      <g transform="translate(232,40)">
        <rect width="88" height="88" rx="16" fill="url(#tile)" stroke="#a78bfa" stroke-opacity="0.35"/>
        <rect x="30" y="26" width="28" height="34" rx="4" fill="#a78bfa" fill-opacity="0.8"/>
        <rect x="24" y="66" width="40" height="6" rx="3" fill="#475569"/>
      </g>
      <!-- row 2 -->
      <g transform="translate(40,144)">
        <rect width="88" height="88" rx="16" fill="url(#tile)" stroke="#f472b6" stroke-opacity="0.30"/>
        <path d="M44 26 L62 58 L26 58 Z" fill="#f472b6" fill-opacity="0.8"/>
        <rect x="24" y="66" width="40" height="6" rx="3" fill="#475569"/>
      </g>
      <g transform="translate(136,144)">
        <rect width="88" height="88" rx="16" fill="url(#tile)" stroke="#38bdf8" stroke-opacity="0.30"/>
        <rect x="30" y="30" width="28" height="28" rx="6" fill="#38bdf8" fill-opacity="0.7"/>
        <rect x="24" y="66" width="40" height="6" rx="3" fill="#475569"/>
      </g>
      <g transform="translate(232,144)">
        <rect width="88" height="88" rx="16" fill="url(#tile)" stroke="#2dd4bf" stroke-opacity="0.30"/>
        <circle cx="44" cy="44" r="16" fill="#2dd4bf" fill-opacity="0.75"/>
        <rect x="24" y="66" width="40" height="6" rx="3" fill="#475569"/>
      </g>
      <!-- row 3 -->
      <g transform="translate(40,248)">
        <rect width="88" height="88" rx="16" fill="url(#tile)" stroke="#a78bfa" stroke-opacity="0.30"/>
        <rect x="28" y="28" width="32" height="32" rx="6" fill="#a78bfa" fill-opacity="0.7"/>
        <rect x="24" y="66" width="40" height="6" rx="3" fill="#475569"/>
      </g>
      <g transform="translate(136,248)">
        <rect width="88" height="88" rx="16" fill="url(#tile)" stroke="#f472b6" stroke-opacity="0.30"/>
        <rect x="26" y="30" width="36" height="8" rx="4" fill="#f472b6" fill-opacity="0.8"/>
        <rect x="26" y="46" width="36" height="8" rx="4" fill="#f472b6" fill-opacity="0.55"/>
        <rect x="26" y="62" width="24" height="8" rx="4" fill="#f472b6" fill-opacity="0.4"/>
      </g>
      <g transform="translate(232,248)">
        <rect width="88" height="88" rx="16" fill="url(#tile)" stroke="#38bdf8" stroke-opacity="0.30"/>
        <path d="M44 28 L60 52 L28 52 Z" fill="#38bdf8" fill-opacity="0.8"/>
        <rect x="24" y="66" width="40" height="6" rx="3" fill="#475569"/>
      </g>
    </g>
  </g>

  <!-- bottom tagline -->
  <text x="96" y="560" fill="#64748b" font-size="22" font-weight="400">把杂乱的桌面图标，分门别类收进你的“图标巢”</text>
</svg>
